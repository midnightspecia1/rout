# The IDE the plugin is compiled against: a local install, so no SDK
# download. Override per machine: gradlew buildPlugin -PriderPath=...
riderPath=D:/ProgramFiles/JetBrains Rider 2023.1.3

# The IDE ships its own Kotlin stdlib; bundling another breaks loading.
kotlin.stdlib.default.dependency=false

org.gradle.configuration-cache=true
